<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Defaults for crawlers and link unfurlers that don't run JS. Tags marked
      data-route-meta are replaced per route at runtime (see src/pages/PageMeta.tsx);
      the canonical URL and og:url are rendered per route only.
    -->
    <title data-route-meta>ET AI Labs · Every ET AI product, one front door</title>
    <meta
      data-route-meta
      name="description"
      content="Launch AI Creative Studio, AI Calling Bot, MiniCRM, LeadHub, TCC Video Verification and Marathon Chatbot, explore their APIs and check live service status."
    />
    <meta name="theme-color" content="#fcfcfc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ET AI Labs" />
    <meta property="og:locale" content="en_IN" />
    <meta
      data-route-meta
      property="og:title"
      content="ET AI Labs · Every ET AI product, one front door"
    />
    <meta
      data-route-meta
      property="og:description"
      content="Launch AI Creative Studio, AI Calling Bot, MiniCRM, LeadHub, TCC Video Verification and Marathon Chatbot, explore their APIs and check live service status."
    />
    <meta property="og:image" content="https://etaiprod.indiatimes.com/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ET AI Labs: every ET AI tool, one front door" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://etaiprod.indiatimes.com/og.jpg" />
    <meta name="twitter:image:alt" content="ET AI Labs: every ET AI tool, one front door" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px">

</html>
